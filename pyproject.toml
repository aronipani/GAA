[project]
name = "parser-lab"
version = "0.1.0"
description = "Controlled comparison of labelling techniques for small log-parsing models."
requires-python = ">=3.11"

# Pinned, and every one of these has an aarch64 wheel or is pure Python
# (CLAUDE.md rule 10 - the remote box is ARM64).
dependencies = [
    "pyyaml==6.0.2",
    "jsonschema==4.23.0",
    "httpx==0.27.2",
    "drain3==0.9.11",
]

[dependency-groups]
dev = [
    "pytest==8.3.3",
    "pytest-asyncio==0.24.0",
    "ruff==0.6.9",
]

[tool.uv]
# There is nothing to build: modules are imported as `src.*` from the repo root,
# which is also how the Makefile invokes them on the Spark.
package = false

[tool.ruff]
line-length = 95
target-version = "py311"

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B", "SIM"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-q"
asyncio_mode = "auto"
asyncio_default_fixture_loop_scope = "function"
markers = [
    "lesson: an unbuilt step's specification. Red until that step is done.",
]
